<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kegastic Royel Limited | Premium Architectural Lighting</title>
    <meta name="description" content="Kegastic Royel delivers architectural-grade, luxury lighting solutions that transform environments into experiences. Discover our premium collections.">
    
    <meta property="og:title" content="Kegastic Royel Limited | Premium Lighting">
    <meta property="og:description" content="Transform your space with architectural-grade, luxury lighting.">
    <meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ================= VARIABLES ================= */
        :root {
            --bg-base: #0a0a0a;
            --bg-card: #1a1a1a;
            --gold-primary: #c9a84c;
            --gold-deep: #8b6914;
            --text-main: #fff8e7;
            --text-muted: #a0a0a0;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'DM Sans', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ================= RESET & GLOBAL ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 500;
            line-height: 1.2;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        /* ================= TYPOGRAPHY & UTILITIES ================= */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .text-center { text-align: center; }
        .text-gold { color: var(--gold-primary); }
        
        .section-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 3rem;
        }

        section {
            padding: 6rem 0;
            position: relative;
        }

        /* ================= BUTTONS ================= */
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            font-family: var(--font-body);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 2px;
            transition: var(--transition);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .btn-gold {
            background-color: var(--gold-primary);
            color: var(--bg-base);
            border: 1px solid var(--gold-primary);
        }

        .btn-gold:hover {
            background-color: var(--gold-deep);
            border-color: var(--gold-deep);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.4);
            transform: scale(1.02);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
        }

        .btn-outline:hover {
            background-color: var(--gold-primary);
            color: var(--bg-base);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
            transform: scale(1.02);
        }

        /* ================= NOTIFICATION BAR ================= */
        .promo-bar {
            background-color: var(--gold-deep);
            color: var(--text-main);
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            position: relative;
            z-index: 1000;
        }

        .promo-bar input {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 2px;
            outline: none;
            font-family: var(--font-body);
        }

        .promo-bar button.subscribe {
            background: var(--bg-base);
            color: var(--gold-primary);
            border: none;
            padding: 0.3rem 1rem;
            cursor: pointer;
            border-radius: 2px;
        }

        .promo-close {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* ================= NAVIGATION ================= */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 999;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(201, 168, 76, 0.1);
            transition: var(--transition);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold-primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-main);
        }

        .hamburger svg { width: 30px; height: 30px; }

        /* ================= HERO SECTION ================= */
        .hero {
            height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(139,105,20,0.15) 0%, rgba(10,10,10,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 2rem;
        }

        .hero h1 {
            font-size: clamp(3rem, 5vw, 5rem);
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .hero-btns {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: var(--gold-primary);
        }

        /* Floating Particles */
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .particle { position: absolute; background: var(--gold-primary); border-radius: 50%; opacity: 0; animation: floatUp 8s infinite linear; }
        .p1 { width: 4px; height: 4px; left: 20%; bottom: -10px; animation-delay: 0s; }
        .p2 { width: 6px; height: 6px; left: 50%; bottom: -10px; animation-delay: 2s; }
        .p3 { width: 3px; height: 3px; left: 80%; bottom: -10px; animation-delay: 4s; }
        .p4 { width: 5px; height: 5px; left: 35%; bottom: -10px; animation-delay: 6s; }
        .p5 { width: 4px; height: 4px; left: 70%; bottom: -10px; animation-delay: 1s; }

        /* ================= TRUST BAR ================= */
        .trust-bar {
            background: var(--bg-card);
            border-top: 1px solid rgba(201, 168, 76, 0.2);
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
            padding: 1rem 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }

        .marquee span {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--gold-primary);
            margin: 0 2rem;
            display: inline-block;
        }

        /* ================= PRODUCTS SECTION ================= */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .product-card {
            background: var(--bg-card);
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid transparent;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid var(--gold-primary);
            opacity: 0;
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .product-card:hover::before {
            opacity: 1;
            box-shadow: inset 0 0 20px rgba(201, 168, 76, 0.2);
        }

        .product-icon {
            color: var(--gold-primary);
            margin-bottom: 1.5rem;
        }
        
        .product-icon svg { width: 48px; height: 48px; }

        .product-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .product-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .link-arrow {
            color: var(--gold-primary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .link-arrow:hover { gap: 1rem; }

        /* ================= USPs SECTION ================= */
        .usps {
            background: #0f0f0f;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .usp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
            text-align: center;
        }

        .usp-item .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .usp-item h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--gold-primary);
        }

        .usp-item p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ================= PROJECTS SECTION ================= */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .project-card {
            height: 400px;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        /* Simulating room lighting with CSS gradients */
        .bg-project-1 { background: radial-gradient(circle at 50% 30%, #4a3b1c 0%, #0a0a0a 80%); }
        .bg-project-2 { background: radial-gradient(circle at 70% 40%, #5c4515 0%, #0a0a0a 75%); }
        .bg-project-3 { background: radial-gradient(circle at 30% 50%, #3a2d13 0%, #0a0a0a 80%); }

        .project-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            opacity: 0;
            transition: var(--transition);
        }

        .project-card:hover .project-overlay { opacity: 1; }

        .project-overlay h3 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .project-overlay p { color: var(--gold-primary); margin-bottom: 1rem; }

        /* ================= PROCESS SECTION ================= */
        .process-wrapper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-top: 4rem;
        }

        .process-line {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(201, 168, 76, 0.2);
            z-index: 1;
        }

        .process-step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 22%;
        }

        .step-number {
            width: 50px;
            height: 50px;
            background: var(--bg-base);
            border: 2px solid var(--gold-primary);
            color: var(--gold-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
            transition: var(--transition);
        }

        .process-step:hover .step-number {
            background: var(--gold-primary);
            color: var(--bg-base);
            box-shadow: 0 0 15px var(--gold-primary);
        }

        .process-step h4 { margin-bottom: 0.5rem; color: var(--text-main); }
        .process-step p { color: var(--text-muted); font-size: 0.9rem; }

        /* ================= TESTIMONIALS ================= */
        .testimonials {
            background: var(--bg-card);
            text-align: center;
        }

        .slider-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
            min-height: 250px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.5s ease-in-out;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .stars { color: var(--gold-primary); font-size: 1.2rem; margin-bottom: 1rem; }
        .quote { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; margin-bottom: 1.5rem; }
        .author { font-weight: 500; color: var(--gold-primary); }
        .author-title { font-size: 0.85rem; color: var(--text-muted); }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active { background: var(--gold-primary); box-shadow: 0 0 10px var(--gold-primary); }

        /* ================= CTA BANNER ================= */
        .cta-banner {
            background: radial-gradient(circle at center, #2a2007 0%, var(--bg-base) 100%);
            text-align: center;
            padding: 8rem 2rem;
        }

        .cta-banner h2 { font-size: 3rem; margin-bottom: 1rem; }
        .cta-banner p { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1.1rem; }
        
        .pulse-btn { animation: pulseGlow 2s infinite; }

        /* ================= FOOTER ================= */
        footer {
            border-top: 1px solid var(--gold-primary);
            padding: 4rem 0 2rem;
            background: #050505;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-brand p { color: var(--text-muted); margin-top: 1rem; font-size: 0.9rem; }
        
        .footer-heading {
            font-family: var(--font-display);
            color: var(--gold-primary);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .footer-links li { margin-bottom: 0.8rem; }
        .footer-links a { color: var(--text-muted); font-size: 0.9rem; }
        .footer-links a:hover { color: var(--gold-primary); padding-left: 5px; }

        .contact-info li { display: flex; gap: 0.8rem; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; align-items: flex-start; }
        
        .social-icons { display: flex; gap: 1rem; }
        .social-icons a {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            color: var(--text-main);
        }
        .social-icons a:hover { background: var(--gold-primary); color: var(--bg-base); border-color: var(--gold-primary); }

        .footer-bottom {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ================= FLOATING ELEMENTS ================= */
        .fab-whatsapp {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            background-color: #25D366; color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 1000; transition: var(--transition);
            animation: pulseWA 2s infinite;
        }

        .fab-whatsapp:hover { transform: scale(1.1); }

        .back-to-top {
            position: fixed; bottom: 30px; right: 100px;
            width: 45px; height: 45px;
            background: var(--bg-card); color: var(--gold-primary);
            border: 1px solid var(--gold-primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: var(--transition); z-index: 999;
        }

        .back-to-top.visible { opacity: 1; pointer-events: auto; }
        .back-to-top:hover { background: var(--gold-primary); color: var(--bg-base); }

        </svg>
    </button>

    <script>
        // 1. Mobile Menu Toggle
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });

        // 2. Scroll Events (Sticky Header & Back to Top)
        const header = document.getElementById('header');
        const backToTop = document.getElementById('backToTop');

        window.addEventListener('scroll', () => {
            // Header styling on scroll
            if (window.scrollY > 50) {
                header.style.background = 'rgba(5, 5, 5, 0.95)';
                header.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
            } else {
                header.style.background = 'rgba(10, 10, 10, 0.85)';
                header.style.boxShadow = 'none';
            }

            // Back to top visibility
            if (window.scrollY > 400) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 3. Intersection Observer for Scroll Animations
        const revealElements = document.querySelectorAll('.reveal');
        
        const revealOptions = {
            threshold: 0.15,
            rootMargin: "0px 0px -50px 0px"
        };

        const revealObserver = new IntersectionObserver(function(entries, observer) {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('active');
                observer.unobserve(entry.target); // Only animate once
            });
        }, revealOptions);

        revealElements.forEach(el => {
            revealObserver.observe(el);
        });

        // 4. Testimonial Slider
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentSlide = 0;
        let slideInterval;

        function goToSlide(n) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            currentSlide = (n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        // Initialize auto-play
        slideInterval = setInterval(nextSlide, 5000);

        // Dot click handlers
        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                clearInterval(slideInterval); // pause auto-play on manual click
                goToSlide(parseInt(e.target.dataset.index));
                slideInterval = setInterval(nextSlide, 5000); // restart
            });
        });

    </script>
</body>
</html>
